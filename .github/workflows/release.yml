name: Release

on:
  workflow_dispatch:
    inputs:
      commit_target:
        description: "Commit, branch, or tag to release"
        required: true
        default: "main"
        type: string
      release_type:
        description: "Release type"
        required: true
        default: "pre-release"
        type: choice
        options:
          - pre-release
          - release

permissions:
  contents: write

jobs:
  validate:
    name: validate release target
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      tag_exists: ${{ steps.meta.outputs.tag_exists }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_target }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/server/Cargo.toml | head -1)"
          if [[ -z "$version" ]]; then
            echo "could not read version from crates/server/Cargo.toml" >&2
            exit 1
          fi
          for manifest in crates/common/Cargo.toml crates/client-backend/Cargo.toml crates/client-cli/Cargo.toml; do
            other="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$manifest" | head -1)"
            if [[ "$other" != "$version" ]]; then
              echo "version mismatch: $manifest has $other, expected $version" >&2
              exit 1
            fi
          done
          tag="v$version"
          input_target="${{ inputs.commit_target }}"
          target_tag=""
          case "$input_target" in
            refs/tags/v*) target_tag="${input_target#refs/tags/}" ;;
            v[0-9]*)
              if git rev-parse -q --verify "refs/tags/$input_target" >/dev/null; then
                target_tag="$input_target"
              fi
              ;;
          esac
          tag_exists="false"
          if [[ -n "$target_tag" ]]; then
            if [[ "$target_tag" != "$tag" ]]; then
              echo "release target tag $target_tag does not match Cargo version $version; expected $tag" >&2
              exit 1
            fi
            tag_commit="$(git rev-list -n 1 "$target_tag")"
            if [[ "$tag_commit" != "$commit_sha" ]]; then
              echo "release target tag $target_tag resolves to $tag_commit, but checkout resolved to $commit_sha" >&2
              exit 1
            fi
            tag_exists="true"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "tag already exists on origin: $tag" >&2
            echo "Use commit_target=$tag to release that existing tag, or bump Cargo.toml to the next version." >&2
            exit 1
          fi
          prerelease="false"
          if [[ "${{ inputs.release_type }}" == "pre-release" ]]; then
            prerelease="true"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release already exists: $tag" >&2
            exit 1
          fi
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Validate release notes
        run: |
          set -euo pipefail
          test -s release_note.md

      - name: Check formatting and workspace build
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo check --workspace

      - name: Check shell scripts
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Check workflow YAML
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml
          python3 - <<'PY'
          import pathlib
          import yaml
          for path in pathlib.Path('.github/workflows').glob('*.yml'):
              yaml.safe_load(path.read_text())
          PY

  ubuntu-deb-anylinux:
    name: ubuntu deb and anylinux binaries
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install packaging and cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross dpkg-dev zip

      - name: Build deb packages and anylinux bundles
        shell: bash
        run: |
          set -euo pipefail
          CLUSTAT_DEB_MULTIARCH=1 scripts/package-deb.sh
          mkdir -p release-assets
          cp dist/clustat-server_*_all.deb release-assets/clustat-server-multiarch.deb
          cp dist/clustat-client_*_all.deb release-assets/clustat-client-multiarch.deb

          make_anylinux_bundle() {
            local arch="$1"
            local server_bin="$2"
            local client_bin="$3"
            local backend_bin="$4"
            local tmpdir
            tmpdir="$(mktemp -d)"
            mkdir -p "$tmpdir/bin" "$tmpdir/etc/clustat"
            cp "$server_bin" "$tmpdir/bin/clustat-server"
            cp "$client_bin" "$tmpdir/bin/clustat"
            cp "$backend_bin" "$tmpdir/bin/clustat-backend"
            cp dist/etc/clustat/server.toml.example "$tmpdir/etc/clustat/server.toml.example"
            cp dist/etc/clustat/client.toml.example "$tmpdir/etc/clustat/client.toml.example"
            (cd "$tmpdir" && zip -qr "${GITHUB_WORKSPACE}/release-assets/clustat-server&client-anylinux-${arch}.zip" .)
            rm -rf "$tmpdir"
          }

          make_anylinux_bundle \
            x86_64 \
            target/release/clustat-server \
            target/release/clustat \
            target/release/clustat-backend
          make_anylinux_bundle \
            aarch64 \
            target/aarch64-unknown-linux-gnu/release/clustat-server \
            target/aarch64-unknown-linux-gnu/release/clustat \
            target/aarch64-unknown-linux-gnu/release/clustat-backend

      - name: Upload Ubuntu/Debian and anylinux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: clustat-ubuntu-deb-anylinux
          path: release-assets/*

  redhat-rpm:
    name: redhat rpm packages
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install packaging and cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build rpm packages
        run: |
          set -euo pipefail
          CLUSTAT_RPM_MULTIARCH=1 scripts/package-rpm.sh
          mkdir -p release-assets
          cp dist/clustat-server-*.noarch.rpm release-assets/clustat-server-multiarch.rpm
          cp dist/clustat-client-*.noarch.rpm release-assets/clustat-client-multiarch.rpm

      - name: Upload RedHat/CentOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: clustat-redhat-rpm
          path: release-assets/*

  archlinux-client:
    name: archlinux client package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build Arch Linux client package
        run: |
          set -euo pipefail
          scripts/package-archlinux-client.sh
          mkdir -p release-assets
          cp dist/*.pkg.tar.zst release-assets/clustat-client-archlinux-multiarch.pkg.tar.zst

      - name: Upload Arch Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: clustat-archlinux-client
          path: release-assets/*

  macos-client:
    name: macos multiarch client
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build per-arch client binaries
        run: |
          set -euxo pipefail
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --locked --release --target "$target" -p clustat-client-backend
            cargo build --locked --release --target "$target" -p clustat-client-cli
          done

      - name: Create universal client package
        run: |
          set -euxo pipefail
          pkgdir="package-root"
          mkdir -p "release-assets" "$pkgdir/bin" "$pkgdir/etc/clustat"
          lipo -create \
            target/x86_64-apple-darwin/release/clustat \
            target/aarch64-apple-darwin/release/clustat \
            -output "$pkgdir/bin/clustat"
          lipo -create \
            target/x86_64-apple-darwin/release/clustat-backend \
            target/aarch64-apple-darwin/release/clustat-backend \
            -output "$pkgdir/bin/clustat-backend"
          cp dist/etc/clustat/client.toml.example "$pkgdir/etc/clustat/client.toml.example"
          cp dist/etc/clustat/client.toml.example "$pkgdir/etc/clustat/client.toml"
          tar -C "$pkgdir" -czf "release-assets/clustat-client-macos-multiarch.tar.gz" .

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: clustat-macos-client
          path: release-assets/*

  windows-client:
    name: windows multiarch client gnullvm
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnullvm,aarch64-pc-windows-gnullvm

      - name: Install LLVM-MinGW
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "20251007"
          $zip = "llvm-mingw-$version-ucrt-x86_64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$zip"
          Invoke-WebRequest $url -OutFile $zip
          Expand-Archive $zip -DestinationPath .
          $root = Join-Path $PWD.Path "llvm-mingw-$version-ucrt-x86_64\bin"
          echo $root | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build client binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --locked --release --target x86_64-pc-windows-gnullvm -p clustat-client-cli
          cargo build --locked --release --target aarch64-pc-windows-gnullvm -p clustat-client-cli

      - name: Package Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force release-assets, package-root\bin, package-root\etc\clustat | Out-Null
          Copy-Item target\x86_64-pc-windows-gnullvm\release\clustat.exe package-root\bin\clustat-client-x86_64.exe
          Copy-Item target\aarch64-pc-windows-gnullvm\release\clustat.exe package-root\bin\clustat-client-aarch64.exe
          Copy-Item dist\etc\clustat\client.toml.example package-root\etc\clustat\client.toml.example
          Copy-Item dist\etc\clustat\client.toml.example package-root\etc\clustat\client.toml
          Compress-Archive -Path package-root\* -DestinationPath "release-assets\clustat-client-windows-multiarch.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: clustat-windows-client
          path: release-assets/*

  test:
    name: test after build
    needs:
      - validate
      - ubuntu-deb-anylinux
      - redhat-rpm
      - archlinux-client
      - macos-client
      - windows-client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: |
          set -euo pipefail
          cargo test --workspace
          cargo test -p clustat-server
          cargo test -p clustat-client-backend
          cargo check -p clustat-server --features nvml

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release artifact names
        run: |
          set -euo pipefail
          expected=(
            "clustat-server-multiarch.deb"
            "clustat-client-multiarch.deb"
            "clustat-server-multiarch.rpm"
            "clustat-client-multiarch.rpm"
            "clustat-client-archlinux-multiarch.pkg.tar.zst"
            "clustat-client-macos-multiarch.tar.gz"
            "clustat-client-windows-multiarch.zip"
            "clustat-server&client-anylinux-x86_64.zip"
            "clustat-server&client-anylinux-aarch64.zip"
          )
          for file in "${expected[@]}"; do
            test -s "release-assets/$file"
          done

  publish:
    name: create release and upload attachments
    needs:
      - validate
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          TAG_EXISTS: ${{ needs.validate.outputs.tag_exists }}
          TARGET_SHA: ${{ needs.validate.outputs.commit_sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$TAG_EXISTS" != "true" ]]; then
            git tag -a "$TAG" "$TARGET_SHA" -m "clustat $TAG"
            git push origin "refs/tags/$TAG"
          fi
          args=(release create "$TAG" release-assets/* --target "$TARGET_SHA" --title "clustat $TAG" --notes-file release_note.md)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
