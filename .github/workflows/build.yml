name: build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Existing GitHub Release tag to attach artifacts to"
        required: true
        default: pre
        type: choice
        options:
          - pre
          - release

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build server without warnings gate
        run: cargo build --locked -p server

      - name: Build client backend without warnings gate
        run: cargo build --locked -p gpustat4cluster-client-backend

      - name: Run server KCP feature tests
        run: cargo test -p server --features kcp-transport

      - name: Run client backend KCP feature tests
        run: cargo test -p gpustat4cluster-client-backend --features kcp-transport

      - name: Check server KCP plus NVML features
        run: cargo check -p server --features "kcp-transport nvml"

      - name: Smoke local release package artifact
        run: bash scripts/smoke-package-artifact.sh

  ubuntu-deb:
    name: ubuntu multiarch deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install packaging and cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross dpkg-dev

      - name: Build deb packages
        run: GPUSTAT4CLUSTER_DEB_MULTIARCH=1 scripts/package-deb.sh

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpustat4cluster-ubuntu-deb
          path: dist/*.deb

  redhat-rpm:
    name: redhat multiarch rpm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install packaging and cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build rpm packages
        run: GPUSTAT4CLUSTER_RPM_MULTIARCH=1 scripts/package-rpm.sh

      - name: Upload rpm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gpustat4cluster-redhat-rpm
          path: dist/*.rpm

  archlinux-client:
    name: archlinux client package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Build Arch Linux client package
        run: scripts/package-archlinux-client.sh

      - name: Upload Arch Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpustat4cluster-archlinux-client
          path: dist/*.pkg.tar.zst

  macos-client:
    name: macos multiarch client
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build per-arch client binaries
        run: |
          set -euxo pipefail
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --locked --release --target "$target" -p gpustat4cluster-client-backend --features kcp-transport
            cargo build --locked --release --target "$target" -p gpustat4cluster-client-cli
          done

      - name: Create universal client binaries
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME:-dev}"
          pkgdir="package-root"
          mkdir -p "dist" "$pkgdir/bin" "$pkgdir/etc/gpustat4cluster"
          lipo -create \
            target/x86_64-apple-darwin/release/gpustat4cluster \
            target/aarch64-apple-darwin/release/gpustat4cluster \
            -output "$pkgdir/bin/gpustat4cluster-client"
          lipo -create \
            target/x86_64-apple-darwin/release/gpustat4cluster-client-backend \
            target/aarch64-apple-darwin/release/gpustat4cluster-client-backend \
            -output "$pkgdir/bin/gpustat4cluster-client-backend"
          cp dist/etc/gpustat4cluster/client.toml.example "$pkgdir/etc/gpustat4cluster/client.toml.example"
          cp dist/etc/gpustat4cluster/client.toml.example "$pkgdir/etc/gpustat4cluster/client.toml"
          tar -C "$pkgdir" -czf "dist/gpustat4cluster-client-${version}-macos-universal.tar.gz" .

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpustat4cluster-macos-client-universal
          path: dist/*.tar.gz

  windows-client:
    name: windows multiarch client gnullvm
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnullvm,aarch64-pc-windows-gnullvm

      - name: Install LLVM-MinGW toolchains
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-aarch64-toolchain

      - name: Build client binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "C:\msys64\clang64\bin;C:\msys64\clangarm64\bin;$env:PATH"
          cargo build --locked --release --target x86_64-pc-windows-gnullvm -p gpustat4cluster-client-cli
          cargo build --locked --release --target aarch64-pc-windows-gnullvm -p gpustat4cluster-client-cli

      - name: Package Windows client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          New-Item -ItemType Directory -Force dist, package-root\bin, package-root\etc\gpustat4cluster | Out-Null
          Copy-Item target\x86_64-pc-windows-gnullvm\release\gpustat4cluster.exe package-root\bin\gpustat4cluster-client-x86_64.exe
          Copy-Item target\aarch64-pc-windows-gnullvm\release\gpustat4cluster.exe package-root\bin\gpustat4cluster-client-aarch64.exe
          Copy-Item dist\etc\gpustat4cluster\client.toml.example package-root\etc\gpustat4cluster\client.toml.example
          Copy-Item dist\etc\gpustat4cluster\client.toml.example package-root\etc\gpustat4cluster\client.toml
          Compress-Archive -Path package-root\* -DestinationPath "dist\gpustat4cluster-client-$version-windows-multiarch.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpustat4cluster-windows-client-multiarch-gnullvm
          path: dist/*.zip


  publish:
    name: attach artifacts to ${{ github.event.inputs.channel }}
    needs:
      - test
      - ubuntu-deb
      - redhat-rpm
      - archlinux-client
      - macos-client
      - windows-client
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          channel="${{ github.event.inputs.channel }}"
          if [[ "$channel" != "release" && "$channel" != "pre" ]]; then
            echo "unsupported channel: $channel" >&2
            exit 1
          fi
          if [[ "$channel" == "pre" ]]; then
            prerelease="true"
            title="gpustat4cluster pre-release"
          else
            prerelease="false"
            title="gpustat4cluster release"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "tag=$channel" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.title }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: dist/*
          body: |
            Automated gpustat4cluster ${{ steps.meta.outputs.channel }} build.

            Commit: ${{ github.sha }}
            Trigger: manual workflow_dispatch / ${{ github.event.inputs.channel }}
