name: Nightly test

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      commit_target:
        description: "Commit, branch, or tag to test"
        required: true
        default: "main"
        type: string

concurrency:
  group: nightly-test-${{ github.event_name == 'workflow_dispatch' && inputs.commit_target || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout push target
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Checkout manual target
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_target }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run cargo test
        run: cargo test --workspace

      - name: Run debug cargo test
        run: cargo test -p server --features debug --no-default-features

      - name: Build production binaries
        run: |
          cargo build --locked --release -p server --features nvml
          cargo build --locked --release -p gpustat4cluster-client-backend -p gpustat4cluster-client-cli

      - name: Build debug server binary
        run: cargo build --locked -p server --features debug --no-default-features

      - name: Build e2e test binaries
        run: |
          cargo build --locked --release -p server --features debug --no-default-features
          cargo build --locked --release -p gpustat4cluster-client-backend --features debug
          cargo build --locked --release -p gpustat4cluster-client-cli
          mkdir -p e2e-bin
          cp target/release/server e2e-bin/server
          cp target/release/gpustat4cluster-client-backend e2e-bin/gpustat4cluster-client-backend
          cp target/release/gpustat4cluster e2e-bin/gpustat4cluster

      - name: Upload e2e test binaries
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-binaries
          path: e2e-bin/*

  e2e-basic-tests:
    name: ${{ matrix.name }}
    needs: cargo-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e client-first static tcp
            script: scripts/e2e-client-first-static.sh
          - name: e2e client-first dynamic tcp
            script: scripts/e2e-client-first-dynamic.sh
          - name: e2e server-first static tcp
            script: scripts/e2e-server-first-static.sh
          - name: e2e server-first dynamic tcp
            script: scripts/e2e-server-first-dynamic.sh
          - name: e2e client-first static udp
            script: scripts/e2e-client-first-static-udp.sh
          - name: e2e client-first dynamic udp
            script: scripts/e2e-client-first-dynamic-udp.sh
          - name: e2e server-first static udp
            script: scripts/e2e-server-first-static-udp.sh
          - name: e2e server-first dynamic udp
            script: scripts/e2e-server-first-dynamic-udp.sh
    steps:
      - name: Checkout push target
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Checkout manual target
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_target }}

      - name: Download e2e test binaries
        uses: actions/download-artifact@v8
        with:
          name: e2e-test-binaries
          path: e2e-bin

      - name: Prepare e2e test binaries
        run: chmod +x e2e-bin/*

      - name: Run ${{ matrix.name }}
        run: |
          E2E_SKIP_BUILD=1 \
          SERVER_BIN=/work/e2e-bin/server \
          BACKEND_BIN=/work/e2e-bin/gpustat4cluster-client-backend \
          CLIENT_BIN=/work/e2e-bin/gpustat4cluster \
          scripts/e2e-docker-run.sh ${{ matrix.script }}

  e2e-dynamic-scale:
    name: e2e dynamic scale group ${{ matrix.group }}
    needs: e2e-basic-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group:
          - 0
          - 1
          - 2
          - 3
    steps:
      - name: Checkout push target
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Checkout manual target
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_target }}

      - name: Download e2e test binaries
        uses: actions/download-artifact@v8
        with:
          name: e2e-test-binaries
          path: e2e-bin

      - name: Prepare e2e test binaries
        run: chmod +x e2e-bin/*

      - name: Run e2e dynamic scale group ${{ matrix.group }}
        run: |
          E2E_SCALE_GROUP=${{ matrix.group }} \
          E2E_SKIP_BUILD=1 \
          SERVER_BIN=/work/e2e-bin/server \
          BACKEND_BIN=/work/e2e-bin/gpustat4cluster-client-backend \
          CLIENT_BIN=/work/e2e-bin/gpustat4cluster \
          scripts/e2e-docker-run.sh scripts/e2e-dynamic-scale.sh

  e2e-robustness:
    name: e2e robustness group ${{ matrix.group }}
    needs: e2e-dynamic-scale
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
    steps:
      - name: Checkout push target
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Checkout manual target
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_target }}

      - name: Download e2e test binaries
        uses: actions/download-artifact@v8
        with:
          name: e2e-test-binaries
          path: e2e-bin

      - name: Prepare e2e test binaries
        run: chmod +x e2e-bin/*

      - name: Run e2e robustness group ${{ matrix.group }}
        run: |
          E2E_ROBUSTNESS_GROUP=${{ matrix.group }} \
          E2E_SKIP_BUILD=1 \
          SERVER_BIN=/work/e2e-bin/server \
          BACKEND_BIN=/work/e2e-bin/gpustat4cluster-client-backend \
          CLIENT_BIN=/work/e2e-bin/gpustat4cluster \
          scripts/e2e-docker-run.sh scripts/e2e-robustness.sh
