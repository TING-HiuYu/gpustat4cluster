[package]
name = "server"
version = "0.1.1"
edition = "2021"

[features]
default = []
nvml = ["dep:nvml-wrapper"]

[dependencies]
common = { path = "../common" }
anyhow = "1"
toml = "0.8"

serde_json = "1"
base64 = "0.22"
socket2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
nvml-wrapper = { version = "0.10", optional = true }
