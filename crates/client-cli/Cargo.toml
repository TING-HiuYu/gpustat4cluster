[package]
name = "gpustat4cluster-client-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gpustat4cluster"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
