[package]
name = "clustat-client-cli"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "clustat"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
